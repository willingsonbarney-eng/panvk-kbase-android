name: dump2

# Read-only: prepare the same universal tree as build-driver and print how the
# Android native-buffer extension and HAL entry are wired. Builds nothing.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            patches
            scripts
            profiles
            meson
          sparse-checkout-cone-mode: true

      - name: Fetch and prepare tree
        shell: bash
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          ./scripts/fetch-mesa.sh
          sh ./scripts/prepare-rc5-tree.sh --mesa work/mesa 2>&1 | tail -n 3

      - name: Print wiring
        shell: bash
        run: |
          cd work/mesa
          echo "::group::A native_buffer in non-generated C sources"
          grep -rn "native_buffer\|NATIVE_BUFFER" src/panfrost/vulkan src/vulkan/runtime src/vulkan/wsi --include=*.c --include=*.h | head -60 || true
          echo "::endgroup::"
          echo "::group::B extension table of panvk"
          grep -n "ANDROID\|external_memory_dma_buf\|KHR_swapchain\|KHR_android" src/panfrost/vulkan/panvk_physical_device.c | head -40 || true
          echo "::endgroup::"
          echo "::group::C HAL module / open"
          grep -rn "HAL_MODULE_INFO_SYM\|hwvulkan_module_t\|hwvulkan_device_t\|hw_module_t" src/panfrost/vulkan src/vulkan --include=*.c --include=*.h | head -30 || true
          echo "::endgroup::"
          echo "::group::D GetDeviceProcAddr"
          grep -n "vk_common_GetDeviceProcAddr" -A26 src/vulkan/runtime/vk_device.c | head -60 || true
          echo "::endgroup::"
          echo "::group::E panvk_android.c 90-240"
          grep -n "" src/panfrost/vulkan/panvk_android.c | sed -n '90,240p' || true
          echo "::endgroup::"
