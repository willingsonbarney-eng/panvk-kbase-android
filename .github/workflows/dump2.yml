name: dump2

# Read-only: prepare the same universal tree as build-driver and print how the
# Android native-buffer extension and HAL entry are wired. Builds nothing.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            patches
            scripts
            profiles
            meson
          sparse-checkout-cone-mode: true

      - name: Fetch and prepare tree
        shell: bash
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          ./scripts/fetch-mesa.sh
          sh ./scripts/prepare-rc5-tree.sh --mesa work/mesa 2>&1 | tail -n 3

      - name: Print wiring
        shell: bash
        run: |
          cd work/mesa
          echo "::group::F has_gralloc"
          grep -rn "has_gralloc" src/panfrost/vulkan src/vulkan --include=*.c --include=*.h | head -30 || true
          echo "::endgroup::"
          echo "::group::G physical_device 225-250 and 1400-1420"
          grep -n "" src/panfrost/vulkan/panvk_vX_physical_device.c | sed -n '225,250p;1400,1420p' || true
          echo "::endgroup::"
          echo "::group::H vk_android.c 60-140"
          grep -n "" src/vulkan/runtime/vk_android.c | sed -n '60,140p' || true
          echo "::endgroup::"
          echo "::group::I where u_gralloc fallback vs mapper is chosen"
          grep -rn "vk_android_get_ugralloc" src --include=*.c --include=*.h | head -20 || true
          grep -n "" src/vulkan/runtime/vk_android.c | sed -n '/vk_android_get_ugralloc/,+14p' | head -40 || true
          echo "::endgroup::"
