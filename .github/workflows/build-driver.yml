name: build-driver

# Builds the patched PanVK-kbase driver (universal profile) for Android arm64 and
# publishes it as a pre-release asset: a flat zip with meta.json + libvulkan_panfrost.so.
# Manual trigger only.

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: Check out scripts and patches
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            patches
            scripts
            profiles
            meson
          sparse-checkout-cone-mode: true

      - name: Host packages and toolchain
        shell: bash
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config bison flex cmake zip wget gnupg lsb-release ca-certificates software-properties-common zlib1g-dev libexpat1-dev libzstd-dev libelf-dev libdrm-dev python3-pip
          sudo apt-get install -y --no-install-recommends libx11-dev libx11-xcb-dev libxcb1-dev libxshmfence-dev xorgproto || sudo apt-get install -y --no-install-recommends libx11-dev libx11-xcb-dev libxcb1-dev libxshmfence-dev x11proto-dev
          python3 -m pip install --user --break-system-packages "meson>=1.7" ninja mako pyyaml packaging pycparser ply || python3 -m pip install --user "meson>=1.7" ninja mako pyyaml packaging pycparser ply
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          if sudo /tmp/llvm.sh 22; then V=22; else V=""; fi
          if [ -n "$V" ]; then
            sudo apt-get install -y --no-install-recommends "llvm-$V-dev" "libclang-$V-dev" "libclang-cpp$V-dev" "libclc-$V-dev" "libllvmspirvlib-$V-dev" || true
            echo "LLVM_CONFIG=/usr/bin/llvm-config-$V" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y --no-install-recommends llvm-dev libclang-dev libclc-dev libllvmspirvlib-dev || true
          fi
          sudo apt-get install -y --no-install-recommends spirv-tools || true
          sudo apt-get install -y --no-install-recommends libspirv-tools-dev || true
          sudo apt-get install -y --no-install-recommends glslang-tools || true
          PCDIRS=$(find /usr -name 'libclc*.pc' -o -name 'SPIRV-Tools*.pc' 2>/dev/null | xargs -r -n1 dirname | sort -u | paste -sd:)
          echo "PKG_CONFIG_PATH=$PCDIRS" >> "$GITHUB_ENV"
          echo "pkg-config dirs: $PCDIRS"

      - name: Show toolchain
        shell: bash
        run: |
          meson --version || true
          ninja --version || true
          gcc --version | head -1 || true
          "${LLVM_CONFIG:-llvm-config}" --version || true
          pkg-config --modversion libclc SPIRV-Tools || true
          echo "NDK: ${ANDROID_NDK_LATEST_HOME:-none}"
          ls "${ANDROID_NDK_LATEST_HOME:-/nonexistent}" 2>/dev/null | head -5 || true

      - name: Fetch pinned Mesa
        shell: bash
        run: ./scripts/fetch-mesa.sh

      - name: Apply patch series
        shell: bash
        run: ./scripts/apply-patches.sh --profile g615-v11-csf

      - name: Build host tools
        shell: bash
        run: |
          mkdir -p build
          ./scripts/bootstrap-host-tools.sh --mesa work/mesa --out build/host-tools 2>&1 | tee build/host-tools.out || {
            echo "::group::host-tools meson log tail"
            tail -n 150 build/host-tools/meson-logs/meson-log.txt 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          }

      - name: Build Android driver
        shell: bash
        run: |
          export HOST_TOOLS="${GITHUB_WORKSPACE}/build/host-tools/bin"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          ./scripts/build-android.sh --profile g615-v11-csf --api 29 --ndk "$NDK" || {
            for f in build/android-bionic.log build/libdrm-android.log; do
              echo "::group::tail $f"; tail -n 200 "$f" 2>/dev/null || true; echo "::endgroup::"
            done
            exit 1
          }

      - name: Package
        shell: bash
        run: |
          SO=dist/android-g615-v11-csf/libvulkan_panfrost.so
          ls -l "$SO"
          mkdir -p pkg
          cp "$SO" pkg/libvulkan_panfrost.so
          cat > pkg/meta.json <<'EOF'
          {
            "schemaVersion": 1,
            "name": "PanVK-kbase ANB test ${{ github.run_number }}",
            "description": "Experimental PanVK-kbase build with mapper-less native-buffer layout verification (patch 017). Untested on device.",
            "author": "willingsonbarney-eng (fork of zenithblue-oss/panvk-kbase-android)",
            "packageVersion": "${{ github.run_number }}",
            "vendor": "Mesa",
            "driverVersion": "Vulkan 1.3",
            "minApi": 29,
            "libraryName": "libvulkan_panfrost.so"
          }
          EOF
          NAME="PanVK-kbase-anb-test-${{ github.run_number }}.zip"
          (cd pkg && zip -9 -q "../$NAME" meta.json libvulkan_panfrost.so)
          sha256sum "$NAME" pkg/libvulkan_panfrost.so | tee sha256.txt
          echo "ZIP=$NAME" >> "$GITHUB_ENV"

      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="anb-test-${{ github.run_number }}"
          gh release create "$TAG" "$ZIP" sha256.txt --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "ANB mapper-less test build $TAG" \
            --notes "Experimental and untested on device. Import the zip as-is (do not unzip). See sha256.txt for hashes."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/*.log
            build/*.out
            build/host-tools/meson-logs/meson-log.txt
            build/android-bionic/meson-logs/meson-log.txt
          if-no-files-found: ignore
